<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Khinna Visuals</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink:   #1C1915;
    --gold:  #C9A96E;
    --goldl: #DFC08A;
    --cream: #F7F2EA;
    --sand:  #E8DCCA;
    --muted: #7A6F63;
    --white: #FDFAF5;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    padding: 3rem 1.5rem;
    position: relative;
    overflow-x: hidden;
  }

  /* Corner accents */
  body::before, body::after,
  .corner-bl, .corner-br {
    content: '';
    position: fixed;
    width: 48px;
    height: 48px;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    top: 24px; left: 24px;
    border-top: 1px solid rgba(201,169,110,0.45);
    border-left: 1px solid rgba(201,169,110,0.45);
  }
  body::after {
    top: 24px; right: 24px;
    border-top: 1px solid rgba(201,169,110,0.45);
    border-right: 1px solid rgba(201,169,110,0.45);
  }
  .corner-bl {
    bottom: 24px; left: 24px;
    border-bottom: 1px solid rgba(201,169,110,0.45);
    border-left: 1px solid rgba(201,169,110,0.45);
  }
  .corner-br {
    bottom: 24px; right: 24px;
    border-bottom: 1px solid rgba(201,169,110,0.45);
    border-right: 1px solid rgba(201,169,110,0.45);
  }

  /* Hairline across golden ratio */
  .hairline {
    position: fixed;
    top: 38.2%;
    left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(201,169,110,0.18) 20%,
      rgba(201,169,110,0.28) 50%,
      rgba(201,169,110,0.18) 80%,
      transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── Logo ── */
  .logo-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    margin-bottom: 0.5rem;
  }

  .logo-khinna {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 400;
    font-size: 2.8rem;
    letter-spacing: 0.32em;
    color: var(--white);
    text-transform: uppercase;
    line-height: 1;
  }

  .logo-rule {
    width: 100%;
    height: 1px;
    background: var(--gold);
    opacity: 0.7;
    margin: 0.45rem 0;
  }

  .logo-visuals {
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    font-size: 0.72rem;
    letter-spacing: 0.55em;
    color: var(--gold);
    text-transform: uppercase;
  }

  /* ── Tagline ── */
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-top: 1.4rem;
    margin-bottom: 2.6rem;
    text-align: center;
  }

  /* ── Links ── */
  .links {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
  }

  .link-item {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.4rem;
    border: 1px solid rgba(201,169,110,0.22);
    text-decoration: none;
    color: var(--white);
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
  }

  .link-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(201,169,110,0.04);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .link-item:hover {
    border-color: rgba(201,169,110,0.6);
  }
  .link-item:hover::before { opacity: 1; }

  .link-icon {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link-icon svg {
    width: 22px;
    height: 22px;
    fill: var(--gold);
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 0.1rem;
  }

  .link-platform {
    font-size: 0.62rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
  }

  .link-label {
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--white);
    letter-spacing: 0.03em;
  }

  .link-arrow {
    margin-left: auto;
    color: var(--muted);
    font-size: 1rem;
    transition: color 0.2s, transform 0.2s;
  }
  .link-item:hover .link-arrow {
    color: var(--gold);
    transform: translateX(3px);
  }

  /* ── Footer ── */
  .footer {
    margin-top: 3rem;
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(122,111,99,0.5);
    text-align: center;
  }
</style>
</head>
<body>

</html>
